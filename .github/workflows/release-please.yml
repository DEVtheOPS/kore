name: Release Please

# Single release pipeline, consistent with the other DEVtheOPS projects:
#
#   1. release-please opens/updates a release PR from Conventional Commits,
#      bumping package.json, src-tauri/tauri.conf.json, src-tauri/Cargo.toml,
#      docs/package.json and CHANGELOG.md.
#   2. Merging that PR creates the GitHub release and the vX.Y.Z tag.
#      (The release is created published, not draft: release-please locates
#      the latest release by tag, and draft releases have no tag, which makes
#      it open another release PR for the same commits.)
#   3. Signed installers for every platform are built and attached to it.
#   4. tauri-action's latest.json (the updater manifest) is published to
#      gh-pages as update.json. The updater only sees a release once this
#      step has run, so the short window where the release page has no
#      assets does not affect existing installs.
#
# Manual re-run: dispatch with `tag` set to an existing release tag (e.g.
# v0.4.0) to rebuild and re-attach the installers for that release without
# involving release-please. Useful if a build job failed or a release had to
# be created by hand.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build assets for, e.g. v0.4.0. Leave empty to run release-please."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    if: ${{ github.event.inputs.tag == '' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      release_id: ${{ steps.release.outputs.id }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Resolve which release (if any) the build/publish jobs should target, from
  # either release-please's outputs or the manual `tag` input.
  target:
    name: Resolve release target
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event.inputs.tag != '') }}
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      release_id: ${{ steps.resolve.outputs.release_id }}
    steps:
      - name: Resolve
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_TAG: ${{ github.event.inputs.tag }}
          RP_TAG: ${{ needs.release-please.outputs.tag_name }}
          RP_ID: ${{ needs.release-please.outputs.release_id }}
        run: |
          if [ -n "$MANUAL_TAG" ]; then
            id=$(gh api "repos/${{ github.repository }}/releases/tags/$MANUAL_TAG" --jq .id)
            echo "tag_name=$MANUAL_TAG" >> "$GITHUB_OUTPUT"
            echo "release_id=$id" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=$RP_TAG" >> "$GITHUB_OUTPUT"
            echo "release_id=$RP_ID" >> "$GITHUB_OUTPUT"
          fi

  # release-please can't update Cargo.lock for the root crate, so keep it in
  # sync on the release PR branch after each update.
  sync-cargo-lock:
    name: Sync Cargo.lock on release PR
    needs: release-please
    if: ${{ needs.release-please.outputs.prs_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Update Cargo.lock for the bumped crate version
        run: cargo update --workspace --manifest-path src-tauri/Cargo.toml

      - name: Commit if changed
        run: |
          if git diff --quiet -- src-tauri/Cargo.lock; then
            echo "Cargo.lock already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git commit -m "chore: sync Cargo.lock with release version"
          git push

  build:
    name: Build (${{ matrix.name }})
    needs: target
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macOS-Silicon
            rust_target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            name: macOS-Intel
            rust_target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - platform: macos-latest
            name: macOS-Universal
            rust_target: "aarch64-apple-darwin,x86_64-apple-darwin"
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            name: Linux-x86_64
            rust_target: x86_64-unknown-linux-gnu
            args: "--target x86_64-unknown-linux-gnu"
          - platform: windows-latest
            name: Windows-x86_64
            rust_target: x86_64-pc-windows-msvc
            args: "--target x86_64-pc-windows-msvc"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.target.outputs.tag_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.target.outputs.release_id }}
          args: ${{ matrix.args }}

  update-pages:
    name: Update gh-pages
    needs: [target, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download updater manifest from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.target.outputs.tag_name }}
        run: |
          mkdir -p gh-pages-update
          # tauri-action generates latest.json (URLs + signatures for every
          # updater artifact). Serve it from gh-pages as update.json, which is
          # the endpoint configured in tauri.conf.json.
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern latest.json --output gh-pages-update/update.json
          python3 -c 'import json; d=json.load(open("gh-pages-update/update.json")); print("version", d["version"], "platforms", sorted(d["platforms"]))'

      - name: Deploy update.json to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-update
          publish_branch: gh-pages
          keep_files: true
