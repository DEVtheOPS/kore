name: zz-probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          set +e
          try() { # $1 label, $2 tag, $3 sha
            gh api -X POST repos/${{ github.repository }}/releases -f tag_name="$2" -f name="$2" -f target_commitish="$3" -F draft=false > /tmp/out.json; rc=$?
            echo "RESULT $1 tag=$2 sha=${3:0:7} exit=$rc $(python3 -c "import json;d=json.load(open('/tmp/out.json'));print(d.get('message','ok'))")"
            ID=$(python3 -c "import json; print(json.load(open('/tmp/out.json')).get('id',''))"); [ -n "$ID" ] && gh api -X DELETE repos/${{ github.repository }}/releases/$ID >/dev/null
            gh api -X DELETE repos/${{ github.repository }}/git/refs/tags/"$2" >/dev/null 2>&1
          }
          try A v0.4.0            ${{ github.sha }}
          try B v0.0.0-zz         2981260924d96b1595927fd19b288eff728d8838
          try C v9.9.9            ${{ github.sha }}
          try D 0.4.0             ${{ github.sha }}
          try E v0.4.0-rc1        ${{ github.sha }}
